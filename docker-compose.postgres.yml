# One-shot Postgres + pgvector for local mengshu (coding/work Agents).
# Usage: docker compose -f docker-compose.postgres.yml up -d
# Then point ~/.mengshu/config.json dbType=postgres at these defaults (or override via env).

services:
  mengshu-postgres:
    image: pgvector/pgvector:pg16
    container_name: mengshu-postgres
    restart: unless-stopped
    ports:
      - "${MENGSHU_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${MENGSHU_PG_USER:-mengshu}
      POSTGRES_PASSWORD: ${MENGSHU_PG_PASSWORD:-mengshu}
      POSTGRES_DB: ${MENGSHU_PG_DATABASE:-mengshu}
    volumes:
      - mengshu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mengshu_pg_data:
